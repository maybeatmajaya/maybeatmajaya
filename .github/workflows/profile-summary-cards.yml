name: GitHub-Profile-Summary-Cards

on:
  push:
  schedule:
    - cron: "0 0 * * *"   # sekali sehari jam 00:00 UTC (lebih jelas dari "* */24 * * *")
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards
    permissions:
      contents: write        # sudah benar, pertahankan
    steps:
      - uses: actions/checkout@v4          # ⬅️ upgrade dari v2
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
